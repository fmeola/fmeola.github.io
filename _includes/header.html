<!doctype html>
<html lang="es" data-lang="es" data-theme="light">
  <head>
    <meta charset="utf-8">
    {% include preferences-init.html %}
    <title>{{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{ site.description }}">
    <link rel="canonical" href="{{ "/" | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:url" content="{{ "/" | absolute_url }}">
    <meta property="og:image" content="{{ "/assets/og-image.png" | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ site.title }}">
    <meta name="twitter:description" content="{{ site.description }}">
    <meta name="twitter:image" content="{{ "/assets/og-image.png" | absolute_url }}">
    <link rel="icon" href="{{ "/assets/favicon.svg" | relative_url }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ "/assets/apple-touch-icon.png" | relative_url }}">
    <link rel="mask-icon" href="{{ "/assets/favicon.svg" | relative_url }}" color="#6b6f76">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
    <link href="{{ "/assets/styles.css" | relative_url }}" rel="stylesheet" type="text/css">
    <script src="{{ "/assets/preferences.js" | relative_url }}" defer></script>
  </head>
  <body>
