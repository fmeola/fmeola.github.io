<!doctype html>
<html lang="{{ page.lang }}" data-lang="{{ page.lang }}" data-theme="light">
  <head>
    <meta charset="utf-8">
    {% include preferences-init.html %}
    <title>{{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    {% assign description = site.description %}
    {% assign social_image = "/assets/og-image.png" %}
    {% if page.lang == "en" %}
      {% assign description = site.description_en %}
      {% assign social_image = "/assets/og-image-en.png" %}
    {% endif %}
    <meta name="description" content="{{ description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" hreflang="es" href="{{ "/" | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ "/en/" | absolute_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ "/" | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title }}">
    <meta property="og:description" content="{{ description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:locale" content="{% if page.lang == 'en' %}en_US{% else %}es_AR{% endif %}">
    <meta property="og:locale:alternate" content="{% if page.lang == 'en' %}es_AR{% else %}en_US{% endif %}">
    <meta property="og:image" content="{{ social_image | absolute_url }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ site.title | escape }}. {{ description | escape }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ site.title }}">
    <meta name="twitter:description" content="{{ description | escape }}">
    <meta name="twitter:image" content="{{ social_image | absolute_url }}">
    <meta name="twitter:image:alt" content="{{ site.title | escape }}. {{ description | escape }}">
    <link rel="icon" href="{{ "/assets/favicon.svg" | relative_url }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ "/assets/apple-touch-icon.png" | relative_url }}">
    <link rel="mask-icon" href="{{ "/assets/pinned-tab.svg" | relative_url }}" color="#6b6f76">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
    <link href="{{ "/assets/styles.css" | relative_url }}?v=2" rel="stylesheet" type="text/css">
  </head>
