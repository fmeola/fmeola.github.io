{% comment %}
  Serve the preferences code with its markup so cached assets cannot mix versions.
  Keep /assets/preferences.js for cached pages from the previous release.
{% endcomment %}
<script>
  (function () {
    var root = document.documentElement;
    var systemTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    var temporaryTheme;

    function readThemePreference() {
      if (temporaryTheme) {
        return temporaryTheme;
      }
      try {
        return window.localStorage.getItem("theme");
      } catch (error) {
        return null;
      }
    }

    function applyThemePreference(theme) {
      if (theme === "light" || theme === "dark") {
        root.setAttribute("data-theme-preference", theme);
        root.setAttribute("data-theme", theme);
      } else {
        root.setAttribute("data-theme-preference", "auto");
        root.setAttribute("data-theme", systemTheme && systemTheme.matches ? "dark" : "light");
      }
    }

    applyThemePreference(readThemePreference());

    document.addEventListener("DOMContentLoaded", function () {
      var langToggle = document.querySelector("[data-lang-toggle]");
      var themeToggle = document.querySelector("[data-theme-toggle]");
      var currentUrl = new URL(window.location.href);
      var requestedLanguage = currentUrl.searchParams.get("lang");
      var alternateUrl = new URL(langToggle.href);
      alternateUrl.search = currentUrl.search;
      alternateUrl.hash = currentUrl.hash;
      if (requestedLanguage !== null) {
        alternateUrl.searchParams.delete("lang");
      }
      langToggle.href = alternateUrl.href;

      // Honor old shared URLs that specified the language in the query string.
      if ((requestedLanguage === "es" || requestedLanguage === "en") && requestedLanguage !== root.lang) {
        window.location.replace(alternateUrl.href);
        return;
      }

      function updateThemeLabel() {
        var isDark = root.getAttribute("data-theme") === "dark";
        var label = root.lang === "en"
          ? (isDark ? "Switch to light mode" : "Switch to dark mode")
          : (isDark ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
        themeToggle.setAttribute("aria-label", label);
      }

      function updateSystemTheme() {
        if (root.getAttribute("data-theme-preference") === "auto") {
          applyThemePreference("auto");
          updateThemeLabel();
        }
      }

      themeToggle.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
        try {
          window.localStorage.setItem("theme", next);
          temporaryTheme = null;
        } catch (error) {
          temporaryTheme = next;
        }
        applyThemePreference(next);
        updateThemeLabel();
      });

      window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
          applyThemePreference(readThemePreference());
          updateThemeLabel();
        }
      });

      if (systemTheme) {
        if (systemTheme.addEventListener) {
          systemTheme.addEventListener("change", updateSystemTheme);
        } else if (systemTheme.addListener) {
          systemTheme.addListener(updateSystemTheme);
        }
        updateSystemTheme();
      }

      updateThemeLabel();
      themeToggle.hidden = false;
    });
  })();
</script>
